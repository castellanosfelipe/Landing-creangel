<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1468" viewBox="0 0 440 1468" role="img" aria-labelledby="ifindit-platform-mobile-title ifindit-platform-mobile-desc">
<title id="ifindit-platform-mobile-title">IFINDIT: five cross-cutting products and capabilities</title>
<desc id="ifindit-platform-mobile-desc">Functional view of IFINDIT. Upstairs, people and teams. Within the platform, IFINDIT SEARCH to find information; IFINDIT DASHBOARD to explore data; IFINDIT DATA CATALOG to organize assets, terms and policies; IFINDIT CHATGEN to talk to knowledge bases; IFINDIT PQRS CLASSIFIER to sort documents and extract metadata. At the base, LakeHouse for storage, SQL and analytic query, and IFINDIT Auth IAM for identities, roles and permissions. Information sources: documents and repositories, databases, applications and APIs. It is a map of capabilities; it does not represent a physical topology or impose a technical processing sequence.</desc>
