<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="ifindit-platform-title ifindit-platform-desc">
<title id="ifindit-platform-title">IFINDIT: five cross-cutting products and capabilities</title>
<desc id="ifindit-platform-desc">Functional view of IFINDIT. Upstairs, people and teams. Within the platform, IFINDIT SEARCH to find information; IFINDIT DASHBOARD to explore data; IFINDIT DATA CATALOG to organize assets, terms and policies; IFINDIT CHATGEN to talk to knowledge bases; IFINDIT PQRS CLASSIFIER to sort documents and extract metadata. At the base, LakeHouse for storage, SQL and analytic query, and IFINDIT Auth IAM for identities, roles and permissions. Information sources: documents and repositories, databases, applications and APIs. It is a map of capabilities; it does not represent a physical topology or impose a technical processing sequence.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#004B8D" stroke-width="1.5"/></marker></defs>
