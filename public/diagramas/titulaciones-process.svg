<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="titulaciones-process-title titulaciones-process-desc">
<title id="titulaciones-process-title">Titulaciones: del archivo al soporte del trámite</title>
<desc id="titulaciones-process-desc">Proceso documentado del caso Titulaciones del Ministerio de Vivienda, Ciudad y Territorio en La Guajira. La información dispersa en notarías, fiduciarias y archivos históricos se consolida, organiza e indexa mediante el trabajo conjunto de las áreas. IFINDIT SEARCH permite búsqueda en lenguaje natural y criterios ajustados a las áreas y usuarios. La localización de una resolución proporciona soporte y trazabilidad para el trámite predial. La fuente reporta pasar de meses a minutos en la búsqueda y un alcance social de más de 197 familias. Este alcance no representa una confirmación individual de entrega de títulos.</desc>
