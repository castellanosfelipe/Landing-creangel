">año y tipo documental.</tspan></text><path d="M591 288H609" fill="none" stroke="#004B8D" stroke-width="2" marker-end="url(#arrow)"/><rect x="616" y="184" width="260" height="218" rx="4" fill="#F3F6F8"/><g transform="translate(638 206) scale(0.9545454545454546)" fill="none" stroke="#004B8D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9v12h12M6 21a17 17 0 1 1 5 15M23 12v12l9 5"/></g><text x="638" y="281" font-size="21" font-weight="700" fill="#103654" text-anchor="start"><tspan x="638" dy="0">Antecedentes</tspan><tspan x="638" dy="27">relevantes</tspan></text><text x="638" y="352" font-size="16" font-weight="400" fill="#486477" text-anchor="start"><tspan x="638" dy="0">Respuestas y contexto</tspan><tspan x="638" dy="23">disponibles para el equipo.</tspan></text><path d="M883 288H901" fill="none" stroke="#004B8D" stroke-width="2" marker-end="url(#arrow)"/><rect x="908" y="184" width="260" height="218" rx="4" fill="#F3F6F8"/><g transform="translate(930 206) scale(0.9545454545454546)" fill="none" stroke="#004B8D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h21l7 7v28H8zM29 5v8h7M14 23l4 4 9-10M14 33h15"/></g><text x="930" y="281" font-size="21" font-weight="700" fill="#103654" text-anchor="start"><tspan x="930" dy="0">Construcción del</tspan><tspan x="930" dy="27">concepto técnico</tspan></text><text x="930" y="352" font-size="16" font-weight="400" fill="#486477" text-anchor="start"><tspan x="930" dy="0">Con apoyo de antecedentes</tspan><tspan x="930" dy="23">y revisión del equipo jurídico.</tspan></text><path d="M32 441 L584 441" fill="none" stroke="#C7D4DE" stroke-width="1.5"/><text x="32" y="484" font-size="29" font-weight="700" fill="#004B8D" text-anchor="start"><tspan x="32" dy="0">156</tspan></text><text x="32" y="514" font-size="18" font-weight="400" fill="#486477" text-anchor="start"><tspan x="32" dy="0">profesionales utilizan la herramienta</tspan></text><path d="M616 441 L1168 441" fill="none" stroke="#C7D4DE" stroke-width="1.5"/><text x="616" y="484" font-size="29" font-weight="700" fill="#004B8D" text-anchor="start"><tspan x="616" dy="0">7–10 días → 3 días</tspan></text><text x="616" y="514" font-size="18" font-weight="400" fill="#486477" text-anchor="start"><tspan x="616" dy="0">para la construcción de conceptos</tspan></text><text x="32" y="558" font-size="18" font-weight="400" fill="#103654" text-anchor="start"><tspan x="32" dy="0">El conocimiento institucional queda disponible para nuevas consultas.</tspan></text><text x="32" y="601" font-size="15" font-weight="400" fill="#486477" text-anchor="start"><tspan x="32" dy="0">Resultados reportados en el caso de éxito de la DEUT, páginas 1–3.</tspan></text></g></svg>