<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1250" viewBox="0 0 440 1250" role="img" aria-labelledby="titulaciones-process-mobile-title titulaciones-process-mobile-desc">
<title id="titulaciones-process-mobile-title">Titulaciones: del archivo al soporte del trámite</title>
<desc id="titulaciones-process-mobile-desc">Proceso documentado del caso Titulaciones del Ministerio de Vivienda, Ciudad y Territorio en La Guajira. La información dispersa en notarías, fiduciarias y archivos históricos se consolida, organiza e indexa mediante el trabajo conjunto de las áreas. IFINDIT SEARCH permite búsqueda en lenguaje natural y criterios ajustados a las áreas y usuarios. La localización de una resolución proporciona soporte y trazabilidad para el trámite predial. La fuente reporta pasar de meses a minutos en la búsqueda y un alcance social de más de 197 familias. Este alcance no representa una confirmación individual de entrega de títulos.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#004B8D" stroke-width="1.5"/></marker></defs>
