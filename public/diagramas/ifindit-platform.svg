<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="ifindit-platform-title ifindit-platform-desc">
<title id="ifindit-platform-title">IFINDIT: cinco productos y capacidades transversales</title>
<desc id="ifindit-platform-desc">Vista funcional de IFINDIT. Arriba, personas y equipos. Dentro de la plataforma, IFINDIT SEARCH para encontrar información; IFINDIT DASHBOARD para explorar datos; IFINDIT DATA CATALOG para organizar activos, términos y políticas; IFINDIT CHATGEN para conversar con bases de conocimiento; IFINDIT CLASIFICADOR DE PQRS para clasificar documentos y extraer metadatos. En la base, LakeHouse para almacenamiento, consulta SQL y analítica, e IFINDIT Auth IAM para identidades, roles y permisos. Fuentes de información: documentos y repositorios, bases de datos, aplicaciones y APIs. Es un mapa de capacidades; no representa una topología física ni impone una secuencia técnica de procesamiento.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#004B8D" stroke-width="1.5"/></marker></defs>
