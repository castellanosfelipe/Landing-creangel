<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1250" viewBox="0 0 440 1250" role="img" aria-labelledby="deut-process-mobile-title deut-process-mobile-desc">
<title id="deut-process-mobile-title">DEUT: del antecedente al concepto técnico</title>
<desc id="deut-process-mobile-desc">Proceso documentado de la DEUT del Ministerio de Vivienda, Ciudad y Territorio. Se consultan documentos y conceptos históricos con IFINDIT SEARCH, se filtra por temática, año y tipo documental, se recuperan antecedentes relevantes y el equipo construye conceptos técnicos con revisión jurídica. El caso reporta 156 profesionales utilizando la herramienta y un cambio de 7–10 días a 3 días para construir conceptos. El diagrama resume el trabajo descrito y no atribuye al software la validación jurídica de las respuestas.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L6 3L0 6" fill="none" stroke="#004B8D" stroke-width="1.5"/></marker></defs>
