" dy="0">Filtros por temática,</tspan><tspan x="104" dy="24">año y tipo documental.</tspan></text><path d="M220 550v17" fill="none" stroke="#004B8D" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="572" width="384" height="156" rx="4" fill="#F3F6F8"/><g transform="translate(46 597) scale(0.8181818181818182)" fill="none" stroke="#004B8D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9v12h12M6 21a17 17 0 1 1 5 15M23 12v12l9 5"/></g><text x="104" y="611" font-size="21" font-weight="700" fill="#103654" text-anchor="start"><tspan x="104" dy="0">Antecedentes</tspan><tspan x="104" dy="27">relevantes</tspan></text><text x="104" y="676" font-size="17" font-weight="400" fill="#486477" text-anchor="start"><tspan x="104" dy="0">Respuestas y contexto</tspan><tspan x="104" dy="24">disponibles para el equipo.</tspan></text><path d="M220 734v17" fill="none" stroke="#004B8D" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="756" width="384" height="156" rx="4" fill="#F3F6F8"/><g transform="translate(46 781) scale(0.8181818181818182)" fill="none" stroke="#004B8D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h21l7 7v28H8zM29 5v8h7M14 23l4 4 9-10M14 33h15"/></g><text x="104" y="795" font-size="21" font-weight="700" fill="#103654" text-anchor="start"><tspan x="104" dy="0">Construcción del</tspan><tspan x="104" dy="27">concepto técnico</tspan></text><text x="104" y="860" font-size="17" font-weight="400" fill="#486477" text-anchor="start"><tspan x="104" dy="0">Con apoyo de antecedentes</tspan><tspan x="104" dy="24">y revisión del equipo jurídico.</tspan></text><path d="M28 942 L412 942" fill="none" stroke="#C7D4DE" stroke-width="1.5"/><text x="28" y="978" font-size="27" font-weight="700" fill="#004B8D" text-anchor="start"><tspan x="28" dy="0">156</tspan></text><text x="28" y="1010" font-size="18" font-weight="400" fill="#486477" text-anchor="start"><tspan x="28" dy="0">profesionales utilizan</tspan><tspan x="28" dy="24">la herramienta</tspan></text><path d="M28 1060 L412 1060" fill="none" stroke="#C7D4DE" stroke-width="1.5"/><text x="28" y="1096" font-size="27" font-weight="700" fill="#004B8D" text-anchor="start"><tspan x="28" dy="0">7–10 días → 3 días</tspan></text><text x="28" y="1128" font-size="18" font-weight="400" fill="#486477" text-anchor="start"><tspan x="28" dy="0">para la construcción</tspan><tspan x="28" dy="24">de conceptos</tspan></text><text x="28" y="1200" font-size="15" font-weight="400" fill="#486477" text-anchor="start"><tspan x="28" dy="0">Resultados reportados en el documento del caso.</tspan><tspan x="28" dy="24">DEUT: páginas 1–3.</tspan></text></g></svg>