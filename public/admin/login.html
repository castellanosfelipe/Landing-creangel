<!doctype html><html lang="es-CO"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Acceso de editores | Creangel</title><link rel="icon" href="/assets/favicon-32.png"><link rel="stylesheet" href="/admin/account.css">
<script defer src="/admin/account.js"></script><script defer src="/admin/login.js"></script></head><body>
<main class="access-card"><a href="/"><img class="brand" src="/assets/logo-creangel.png" width="272" height="67" alt="Creangel, inicio"></a>
<h1 id="heading">Acceso de editores</h1><p id="intro">Ingrese con la cuenta asignada por el administrador del portal.</p>
<p id="message" role="status" aria-live="polite"></p>
<form id="login-form"><label>Usuario<input name="username" autocomplete="username" required maxlength="64" autofocus></label>
<label>Contraseña<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
<button type="submit">Iniciar sesión</button></form>
<form id="password-form" hidden><label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
<label>Confirmar contraseña<input name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
<p class="hint">Use al menos 12 caracteres. Esta contraseña reemplazará la contraseña inicial.</p><button type="submit">Cambiar contraseña y continuar</button></form>
<p><a href="/">Regresar al sitio</a></p><p class="hint">Si olvidó su contraseña, solicite un restablecimiento al administrador.</p></main></body></html>
