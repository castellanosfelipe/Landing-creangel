# Content and accounts are managed by the portal server.
backend:
  name: creangel-local
  proxy_url: /api/content

publish_mode: simple
site_url: '{{PUBLIC_SITE_URL}}'
display_url: '{{PUBLIC_SITE_URL}}/documentacion/'
logo_url: '{{PUBLIC_SITE_URL}}/assets/logo-creangel.png'
locale: es
media_folder: public/multimedia/documentacion
public_folder: /multimedia/documentacion

collections:
  - name: documentation_es
    label: Documentación · Español
    label_singular: Documento en español
    description: Documentación pública de IFINDIT en español. Al guardar se prepara su publicación.
    folder: documentation/docs
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{fields.id}}'
    identifier_field: id
    summary: '{{title}}'
    preview_path: 'documentacion/{{fields.slug}}'
    preview_path_preserve_slashes: true
    fields:
      - label: Identificador permanente
        name: id
        widget: string
        required: true
        hint: Define el nombre del archivo y debe coincidir en español e inglés. No cambie el identificador de un documento existente.
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - 'Use letras minúsculas sin acentos, números y guiones; conserve el identificador existente.'
      - {label: Título, name: title, widget: string}
      - {label: Descripción, name: description, widget: text}
      - {label: Orden en el menú, name: sidebar_position, widget: number, value_type: int, min: 1, default: 20}
      - label: Ruta del documento
        name: slug
        widget: string
        hint: Use / para la introducción o una ruta como /productos/ifindit-search. El prefijo /en está reservado para el idioma inglés. Conserve la ruta de los documentos existentes.
        pattern:
          - '^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?$'
          - 'Use una ruta con letras minúsculas sin acentos, números, guiones y barras.'
      - label: Contenido
        name: body
        widget: markdown
        modes: [rich_text, raw]
        editor_components: [image, code-block]
  - name: documentation_en
    label: Documentation · English
    label_singular: English document
    description: Public IFINDIT documentation in English. Create the Spanish original first, then use the same identifier and route for its English translation.
    folder: documentation/i18n/en/docusaurus-plugin-content-docs/current
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: '{{fields.id}}'
    identifier_field: id
    summary: '{{title}}'
    preview_path: 'documentacion/en/{{fields.slug}}'
    preview_path_preserve_slashes: true
    fields:
      - label: Permanent identifier
        name: id
        widget: string
        required: true
        hint: Determines the filename and must match the Spanish document. Do not change an existing document's identifier.
        pattern:
          - '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          - 'Use lowercase unaccented letters, numbers and hyphens; keep existing identifiers unchanged.'
      - {label: Title, name: title, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Menu order, name: sidebar_position, widget: number, value_type: int, min: 1, default: 20}
      - label: Document route
        name: slug
        widget: string
        hint: Use / for the introduction. The /en prefix is reserved for the English site. Keep the same filename and route as the corresponding Spanish document.
        pattern:
          - '^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?$'
          - 'Use lowercase unaccented letters, numbers, hyphens and slashes.'
      - label: Content
        name: body
        widget: markdown
        modes: [rich_text, raw]
        editor_components: [image, code-block]
