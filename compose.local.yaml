name: creangel-local
services:
  init:
    image: creangel-local-runtime:latest
    build:
      context: .
      target: portal-runtime
      args:
        PUBLIC_SITE_URL: http://127.0.0.1:${LOCAL_PORT:-8785}
    user: "0:0"
    command: [node, /app/ops/storage/init.mjs]
    environment:
      PUBLIC_SITE_URL: http://127.0.0.1:${LOCAL_PORT:-8785}
    volumes: [workspace:/workspace, releases:/srv/releases, editor_data:/var/lib/editor]
    network_mode: none
    restart: "no"
  editor:
    image: creangel-local-runtime:latest
    build:
      context: .
      target: portal-runtime
      args:
        PUBLIC_SITE_URL: http://127.0.0.1:${LOCAL_PORT:-8785}
    command: [node, /app/ops/editor/server.mjs]
    environment:
      PUBLIC_SITE_URL: http://127.0.0.1:${LOCAL_PORT:-8785}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/editor_admin_password
      EDITOR_DATABASE: /var/lib/editor/editor.sqlite
      CONTENT_ROOT: /workspace
    secrets: [editor_admin_password]
    volumes: [workspace:/workspace, editor_data:/var/lib/editor]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, /app/ops/storage/health.mjs, "8081", /api/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    networks: [internal]
  builder:
    image: creangel-local-runtime:latest
    build:
      context: .
      target: portal-runtime
      args:
        PUBLIC_SITE_URL: http://127.0.0.1:${LOCAL_PORT:-8785}
    command: [node, /app/ops/storage/worker.mjs]
    environment:
      PUBLIC_SITE_URL: http://127.0.0.1:${LOCAL_PORT:-8785}
    volumes: [workspace:/workspace, releases:/srv/releases]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, /app/ops/storage/health.mjs, "8082", /status]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 2m
    networks: [internal]
  web:
    build: {context: ., target: web}
    volumes: [releases:/srv/releases:ro, ./ops/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      editor: {condition: service_healthy}
      builder: {condition: service_healthy}
    restart: unless-stopped
    networks: [internal, host_access]
    ports: ["127.0.0.1:${LOCAL_PORT:-8785}:8080"]
secrets:
  editor_admin_password:
    file: ${EDITOR_ADMIN_PASSWORD_PATH:-./secrets/editor-admin-password}
volumes:
  workspace:
  releases:
  editor_data:
networks:
  internal: {internal: true}
  host_access: {}
