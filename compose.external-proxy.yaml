# Optional: use an existing HTTPS proxy on the same server instead of Caddy.
services:
  proxy:
    profiles: [bundled-https]
  web:
    ports:
      - "127.0.0.1:${WEB_LOCAL_PORT:-8080}:8080"
    # A solely internal network cannot publish the loopback host port.
    networks: [internal, host_proxy]
networks:
  host_proxy: {}
