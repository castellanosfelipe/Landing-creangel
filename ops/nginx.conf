include /etc/nginx/seo/nginx-redirects.conf;

# Docker changes service addresses when containers are recreated. Nginx 1.28
# resolves these names again without restarting the static website service.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
upstream creangel_auth {
    zone creangel_auth 64k;
    server auth:3000 resolve;
}
upstream creangel_publisher {
    zone creangel_publisher 64k;
    server publisher:3001 resolve;
}

map $uri $static_cache_control {
    default "no-cache";
    ~^/(?:admin|auth|publish)(?:/|$) "no-store";
    ~*\.(?:css|js)$ "public, max-age=3600";
    ~*\.(?:avif|gif|ico|jpe?g|png|svg|webp)$ "public, max-age=86400";
    ~*\.woff2$ "public, max-age=31536000";
}

server {
    listen 8080;
    server_name _;
    root /srv/releases/current;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $static_cache_control always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    if ($legacy_target) { return 301 $legacy_target$is_args$args; }
    location = /health { access_log off; try_files /site-manifest.json =503; }
    location ^~ /auth/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://creangel_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /publish/webhook {
        access_log off;
        client_max_body_size 1m;
        proxy_pass http://creangel_publisher;
    }
    location ^~ /publish/ { return 404; }
    location ^~ /documentacion/en/ {
        try_files $uri $uri/ =404;
        error_page 404 /documentacion/en/404.html;
    }
    location ^~ /documentacion/ {
        try_files $uri $uri/ =404;
        error_page 404 /documentacion/404.html;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location ^~ /admin/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
