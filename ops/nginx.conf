server {
    listen 8080;
    server_name _;
    root /srv/releases/current;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location = /health { access_log off; try_files /site-manifest.json =503; }
    location ^~ /auth/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://auth:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /publish/webhook {
        access_log off;
        client_max_body_size 1m;
        proxy_pass http://publisher:3001;
    }
    location ^~ /publish/ { return 404; }
    location ^~ /documentacion/en/ {
        try_files $uri $uri/ =404;
        error_page 404 /documentacion/en/404.html;
    }
    location ^~ /documentacion/ {
        try_files $uri $uri/ =404;
        error_page 404 /documentacion/404.html;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location ^~ /admin/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
