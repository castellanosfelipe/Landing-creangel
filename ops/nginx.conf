include /etc/nginx/seo/nginx-redirects.conf;

# Docker changes service addresses when containers are recreated. Nginx 1.28
# resolves these names again without restarting the static website service.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
# The private web service only receives requests from Caddy or the loopback
# external proxy. That trusted boundary overwrites X-Real-IP with its client IP.
map $http_x_real_ip $editor_client_ip {
    default $remote_addr;
    ~^[0-9a-fA-F:.]+$ $http_x_real_ip;
}
upstream creangel_editor {
    zone creangel_editor 64k;
    server editor:8081 resolve;
}
upstream creangel_builder {
    zone creangel_builder 64k;
    server builder:8082 resolve;
}

map $uri $static_cache_control {
    default "no-cache";
    ~^/(?:admin|api)(?:/|$) "no-store";
    ~*\.(?:css|js)$ "public, max-age=3600";
    ~*\.(?:avif|gif|ico|jpe?g|png|svg|webp)$ "public, max-age=86400";
    ~*\.woff2$ "public, max-age=31536000";
}

server {
    listen 8080;
    server_name _;
    root /srv/releases/current;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $static_cache_control always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    if ($legacy_target) { return 301 $legacy_target$is_args$args; }
    location = /health { access_log off; try_files /site-manifest.json =503; }
    location ^~ /api/ {
        access_log off;
        client_max_body_size 15m;
        proxy_pass http://creangel_editor;
        proxy_set_header X-Real-IP $editor_client_ip;
        proxy_set_header Host $host;
    }
    location = /local/status { proxy_pass http://creangel_builder/status; }
    location ^~ /auth/ { return 404; }
    location ^~ /publish/ { return 404; }
    location ^~ /cms-proxy/ { return 404; }
    location ^~ /documentacion/en/ {
        try_files $uri $uri/ =404;
        error_page 404 /documentacion/en/404.html;
    }
    location ^~ /documentacion/ {
        try_files $uri $uri/ =404;
        error_page 404 /documentacion/404.html;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location ^~ /admin/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
