# Policies are selected by section; JSON-LD remains data, never executable.
map $uri $portal_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/admin(?:/|$) "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/documentacion(?:/|$) "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/(?:en/)?soporte(?:/|$) "default-src 'self'; script-src 'self' https://jsd-widget.atlassian.com; style-src 'self' 'unsafe-inline' https://jsd-widget.atlassian.com; img-src 'self' data: https://jsd-widget.atlassian.com https://creangel-team.atlassian.net; font-src 'self' data: https://jsd-widget.atlassian.com; connect-src 'self' https://o55978.ingest.sentry.io https://xp.atlassian.com https://jsd-widget.atlassian.com https://creangel-team.atlassian.net https://jsm-channel-orchestrator.services.atlassian.com https://jsm-channels-bridge.services.atlassian.com; frame-src 'self' https://jsd-widget.atlassian.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self' https://jsd-widget.atlassian.com https://creangel-team.atlassian.net; form-action 'self' https://jsd-widget.atlassian.com https://creangel-team.atlassian.net; frame-ancestors 'self'";
}
map $uri $portal_frame_options { default SAMEORIGIN; }
map $uri $portal_referrer_policy { default strict-origin-when-cross-origin; ~^/admin(?:/|$) no-referrer; }
limit_req_zone $editor_client_ip zone=editor_requests:10m rate=20r/s;
limit_conn_zone $editor_client_ip zone=editor_connections:10m;
map $status $cms_deny_log {default 0; ~^[45] 1;}
log_format cms_security escape=json '{"type":"cms_proxy_denial","timestamp":"$time_iso8601","client":"$editor_client_ip","method":"$request_method","status":$status,"requestId":"$request_id","upstreamRequestId":"$upstream_http_x_request_id"}';
