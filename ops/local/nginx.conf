include /etc/nginx/seo/nginx-redirects.conf;

# Docker changes service addresses when containers are recreated. Nginx 1.28
# resolves these names again without restarting the static website service.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
map $remote_addr $editor_client_ip { default $remote_addr; }
include /etc/nginx/nginx-security.conf;
upstream creangel_editor {
    zone creangel_editor 64k;
    server editor:8081 resolve;
}
upstream creangel_builder {
    zone creangel_builder 64k;
    server builder:8082 resolve;
}

map $uri $static_cache_control {
    default "no-cache";
    ~^/(?:admin|api)(?:/|$) "no-store";
    ~*\.(?:css|js)$ "public, max-age=3600";
    ~*\.(?:avif|gif|ico|jpe?g|png|svg|webp)$ "public, max-age=86400";
    ~*\.woff2$ "public, max-age=31536000";
}

server {
    listen 8080;
    server_name _;
    root /srv/releases/current;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy $portal_referrer_policy always;
    add_header X-Frame-Options $portal_frame_options always;
    add_header Content-Security-Policy $portal_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control no-store always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_max_body_size 15m;
    limit_req_status 429;
    limit_conn_status 429;
    if ($legacy_target) { return 301 $legacy_target$is_args$args; }
    location = /health { access_log off; try_files /site-manifest.json =503; }
    location ^~ /api/ {
        limit_req zone=editor_requests burst=60 nodelay;
        limit_conn editor_connections 30;
        access_log /dev/stdout cms_security if=$cms_deny_log;
        client_max_body_size 15m;
        proxy_pass http://creangel_editor;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location = /local/status { proxy_pass http://creangel_builder/status; }
    location ^~ /auth/ { return 404; }
    location ^~ /publish/ { return 404; }
    location ^~ /cms-proxy/ { return 404; }
    location ^~ /documentacion/en/ {
        try_files $uri $uri/ =404;
        error_page 404 /documentacion/en/404.html;
    }
    location ^~ /documentacion/ {
        try_files $uri $uri/ =404;
        error_page 404 /documentacion/404.html;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location ^~ /admin/ {
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
